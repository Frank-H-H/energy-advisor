<!-- nodes/energy-advisor/energy-advisor.html -->
<script type="text/html" data-template-name="energy-advisor">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name">
  </div>
  <div class="form-row">
    <label for="node-input-strategies"><i class="fa fa-cogs"></i> Strategies</label>
    <input type="text" id="node-input-strategies" placeholder="premature-export">
  </div>
  <div class="form-row">
    <label for="node-input-maxExportPowerKw">Max export kW</label>
    <input type="number" id="node-input-maxExportPowerKw" step="0.01" placeholder="7.46">
  </div>
  <div class="form-row">
    <label for="node-input-intervalMinutes">Interval min</label>
    <input type="number" id="node-input-intervalMinutes" step="1" placeholder="15">
  </div>
</script>

<script type="text/html" data-help-name="energy-advisor">
  <p>
    The energy-advisor node accepts the TimeSeries produced by the simulation and creates a Plan.
    Multiple strategies can be activated by entering their IDs separated by commas.
  </p>
  <h4>Input</h4>
  <pre>msg.timeSeries</pre>
  <p><code>msg.payload</code> is accepted as a fallback.</p>
  <h4>Output</h4>
  <pre>msg.payload = { actions, strategyPlans, rejectedProposals }</pre>
  <p>Actions are proposals for external execution. This node does not control devices.</p>
</script>

<script type="text/javascript">
  RED.nodes.registerType('energy-advisor', {
    category: 'energy',
    color: '#f0d36a',
    defaults: {
      name: { value: '' },
      strategies: { value: 'premature-export' },
      maxExportPowerKw: { value: 7.46 },
      intervalMinutes: { value: 15 }
    },
    inputs: 1,
    outputs: 1,
    icon: 'font-awesome/fa-lightbulb-o',
    label: function() {
      return this.name || 'energy-advisor';
    }
  });
</script>
