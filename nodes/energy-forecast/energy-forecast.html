  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name">
  </div>

  <div class="form-row">
    <label for="node-input-system_config">System config</label>
    <select id="node-input-system_config" class="node-config-select"></select>
  </div>
  <div class="form-row">
    <label for="node-input-battery_config">Battery config</label>
    <select id="node-input-battery_config" class="node-config-select"></select>
  </div>
  <div class="form-row">
    <label for="node-input-grid_config">Grid config</label>
    <select id="node-input-grid_config" class="node-config-select"></select>
  </div>

  <div class="form-row">
    <label for="node-input-inputField">Input payload field</label>

<script type="text/html" data-help-name="energy-forecast">
  <p>
    Simulates the expected energy flow of an energy system based on forecasts
    for solar production, load, grid targets and electricity prices.
  </p>

  <h3>Input</h3>

  <p>
    By default, the node expects the forecast in <code>msg.payload</code>.
    The input property can be changed using the <b>Input payload field</b>
    setting.
  </p>

  <pre>{
  "state": {
    "batteryEnergyKwh": 21
  },
  "timeSeries": [
    {
      "start": "2026-08-29T12:00:00Z",
      "end": "2026-08-29T12:15:00Z",
      "solar": {
        "productionPowerKw": 4.2
      },
      "load": {
        "consumptionPowerKw": 1.8
      },
      "grid": {
        "targetPowerKw": 0,
        "buyPerKwh": 0.32,
        "sellPerKwh": 0.08
      }
    }
  ]
}</pre>

  <h4>TimeSeries</h4>

  <p>
    Each timestep contains external forecasts and constraints. Battery energy
    is intentionally not part of an interval input; the Forecast node computes
    it from <code>state.batteryEnergyKwh</code> and the simulated energy flow.
  </p>

  <dl>
    <dt><code>start</code></dt>
    <dd>Start of the forecast timestep.</dd>

    <dt><code>end</code></dt>
    <dd>End of the forecast timestep.</dd>

    <dt><code>solar.productionPowerKw</code></dt>
    <dd>Expected PV production in <b>kW</b>.</dd>

    <dt><code>load.consumptionPowerKw</code></dt>
    <dd>Estimated normal consumption in <b>kW</b>.</dd>

    <dt><code>load.extraPowerKw</code></dt>
    <dd>Optional additional consumption in <b>kW</b>.</dd>

    <dt><code>load.extraEndsAt</code></dt>
    <dd>Optional end timestamp for the additional consumption.</dd>

    <dt><code>grid.targetPowerKw</code></dt>
    <dd>
      Desired grid exchange in <b>kW</b>: positive for import, negative for
      export and zero for no desired exchange.
    </dd>

    <dt><code>grid.buyPerKwh</code></dt>
    <dd>Electricity purchase price per <b>kWh</b>.</dd>

    <dt><code>grid.sellPerKwh</code></dt>
    <dd>Electricity selling price per <b>kWh</b>.</dd>
  </dl>

  <h3>Output</h3>

  <p>
    The node outputs the calculated TimeSeries as <code>msg.payload</code>.
    It can be connected directly to an <code>energy-advisor</code> node.
  </p>

  <pre>{
  "start": "2026-08-29T12:00:00Z",
  "end": "2026-08-29T12:15:00Z",
  "durationMs": 900000,
  "solar": {
    "productionPowerKw": 4.2,
    "missedProductionKwh": 0
  },
  "load": {
    "consumptionPowerKw": 1.8,
    "extraConsumptionKwh": 0
  },
  "battery": {
    "energyKwh": 21.6,
    "chargeKwh": 0.6,
    "dischargeKwh": 0
  },
  "grid": {
    "targetPowerKw": 0,
    "importKwh": 0,
    "exportKwh": 0,
    "buyPerKwh": 0.32,
    "sellPerKwh": 0.08
  },
  "economics": {
    "cost": 0,
    "revenue": 0
  }
}</pre>

  <p>
    Output values are grouped by the component where they occur. The
    <code>battery</code> and <code>economics</code> sections are calculated by
    the Forecast node and are not required in each input interval.
  </p>

  <h3>Configuration</h3>

  <p>The node can use the following configuration nodes:</p>

  <ul>
    <li><b>System config</b> - system-wide simulation settings</li>
    <li><b>Battery config</b> - battery capacity, power limits and efficiencies</li>
    <li><b>Grid config</b> - grid and export limitations</li>
  </ul>
</script>

<script type="text/javascript">

      inputField: { value: 'payload' }
    },
    inputs: 1,
    outputs: 1,
    icon: 'font-awesome/fa-bolt',
    label: function() {
      return this.name || 'energy-forecast';
    }
  });
</script>
