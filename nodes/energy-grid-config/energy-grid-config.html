<script type="text/javascript">

    defaults: {

      return this.name || 'energy-grid-config';

    <label for="node-config-input-max_export_power_kw"><i class="fa fa-bookmark"></i> Max export power (kW)</label>
    <input id="node-config-input-max_export_power_kw" type="number" min="0" step="0.01">
