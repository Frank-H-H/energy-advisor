<script type="text/html" data-template-name="energy-advisor">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name">
  </div>
  <div class="form-row">
    <label for="node-input-strategies"><i class="fa fa-cogs"></i> Strategies</label>
    <input type="text" id="node-input-strategies" placeholder="immediate-negative-price-export,distributed-negative-price-export,battery-min-soc-hold">
  </div>
  <div class="form-row">
    <label for="node-input-maxExportPowerKw">Max export kW</label>
    <input type="number" id="node-input-maxExportPowerKw" step="0.01" placeholder="7.46">
  </div>
  <div class="form-row">
    <label for="node-input-batteryConfig"><i class="fa fa-battery-half-o"></i> Battery</label>
    <input type="text" id="node-input-batteryConfig">
  </div>
</script>

<script type="text/html" data-help-name="energy-advisor">
  <p>
    The energy-advisor node accepts the TimeSeries produced by the simulation and creates a Plan.
    Multiple strategies can be activated by entering their IDs separated by commas. Available strategies are <code>immediate-negative-price-export</code>, <code>distributed-negative-price-export</code> and <code>battery-min-soc-hold</code>.
  </p>
  <h4>Input</h4>
  <p>
    The node consumes the TimeSeries emitted by <code>energy-forecast</code>.
    <code>msg.payload</code> can therefore be passed directly from the Forecast node;
    <code>msg.timeSeries</code> is also accepted.
  </p>
  <pre>[
  {
    "start": "2026-08-29T12:00:00Z",
    "end": "2026-08-29T12:15:00Z",
    "solar": { "productionPowerKw": 4.2, "missedProductionKwh": 0 },
    "load": { "consumptionPowerKw": 1.8, "extraLoads": [] },
    "battery": { "energyKwh": 21.6, "chargeKwh": 0.6, "dischargeKwh": 0 },
    "grid": {
      "targetPowerKw": 0,
      "importKwh": 0,
      "exportKwh": 0,
      "buyPerKwh": 0.32,
      "sellPerKwh": 0.08,
      "spotPerKwh": 0.12
    },
    "economics": { "cost": 0, "revenue": 0 }
  }
]</pre>
  <h4>Output</h4>
  <p>
    The Forecast result in <code>msg.payload</code> is left unchanged. The
    generated Advisor Plan is added separately as <code>msg.plan</code>. This
    allows the plan to be passed to a subsequent <code>energy-forecast</code>
    node for a plan-aware forecast.
  </p>
  <pre>
msg.payload = { timeSeries, summary, initialState }
msg.plan = {
  actions,
  strategyPlans,
  rejectedProposals
}</pre>
  <h4>Strategies</h4>
  <p>Strategies use the actual duration of each TimeSeries timestep from <code>start</code> and <code>end</code>. There is no separate strategy interval setting; the TimeSeries is the source of truth for timestep duration.</p>
  <p>The strategies are applied to every timestep in chronological order. The order of the IDs in the Strategies field defines the order in which the strategies are applied within each timestep: a later strategy sees and builds on the grid target already planned by the earlier strategies.</p>
  <p><code>immediate-negative-price-export</code> exports the energy that would otherwise be exported during negative spot prices in the nearest earlier timesteps.</p>
  <p><code>distributed-negative-price-export</code> exports that energy distributed across all earlier non-negative spot-price timesteps. It does not optimize for the highest prices.</p>
  <p><code>battery-min-soc-hold</code> keeps the battery SOC above a minimum (currently fixed at 15% of the battery capacity). It plans grid imports at the cheapest earlier timesteps based on <code>grid.buyPerKwh</code>, honouring the power dependent charge efficiency curve and the max charge power of the referenced battery config node. It requires a battery config reference; without one the node reports an error.</p>
  <p>Actions are proposals for external execution. This node does not control devices.</p>
</script>

<script type="text/javascript">
  RED.nodes.registerType('energy-advisor', {
    category: 'energy',
    color: '#f0d36a',
    defaults: {
      name: { value: '' },
      strategies: { value: 'immediate-negative-price-export' },
      maxExportPowerKw: { value: 7.46 },
      batteryConfig: { value: '', type: 'energy-battery-config' }
    },
    inputs: 1,
    outputs: 1,
    icon: 'font-awesome/fa-lightbulb-o',
    label: function() {
      return this.name || 'energy-advisor';
    }
  });
</script>
