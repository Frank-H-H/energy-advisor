<script type="text/html" data-template-name="energy-forecast">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input id="node-input-name" type="text" />
  </div>

  <div class="form-row">
    <label for="node-input-system_config">System config</label>
    <select id="node-input-system_config"></select>
  </div>

  <div class="form-row">
    <label for="node-input-inputField">Input payload field</label>
    <input id="node-input-inputField" type="text" placeholder="payload" />
    <div class="form-tips">Which property of msg contains the Forecast input (default: payload)</div>
  </div>
</script>

<script type="text/javascript">
  RED.nodes.registerType('energy-forecast', {
    category: 'function',
    defaults: {
      name: { value: '' },
      system_config: { value: '' },
      inputField: { value: 'payload' }
    },
    label: function () {
      return this.name || 'energy-forecast'
    },
    oneditprepare: function () {
      const select = $('#node-input-system_config')
      select.empty()
      select.append($('<option>').val('').text('-- none --'))
      RED.nodes.eachConfig(function (id, conf) {
        if (conf.type === 'energy-system-config') {
          select.append($('<option>').val(id).text(conf.name || id))
        }
      })
    }
  })
</script>
